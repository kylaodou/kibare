server:
  port: ${PORT:8081}
  compression:
    enabled: true
    mime-types: application/json,text/plain

spring:
  application:
    name: yaaba-api
  datasource:
    url: ${DATABASE_URL:jdbc:h2:file:./data/kibare;AUTO_SERVER=TRUE}
    username: ${DATABASE_USER:sa}
    password: ${DATABASE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 30MB
      max-request-size: 120MB
  jackson:
    default-property-inclusion: non_null

yaaba:
  storage-dir: ${STORAGE_DIR:./uploads}
  cors-origins: ${CORS_ORIGINS:http://localhost:4200,http://localhost:4300}
  jwt-secret: ${JWT_SECRET:kibare-dev-secret-change-me-in-production-2026}
  jwt-hours: 168
  admin:
    email: ${ADMIN_EMAIL:admin@kibare.bf}
    password: ${ADMIN_PASSWORD:kibare2026}
    name: Équipe KIBARE

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs

management:
  endpoints:
    web:
      exposure:
        include: health
