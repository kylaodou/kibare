server:
  port: ${PORT:8081}
  compression:
    enabled: true
    mime-types: application/json,text/plain

spring:
  application:
    name: yaaba-api
  datasource:
    url: ${DATABASE_URL:jdbc:h2:file:./data/yaaba;AUTO_SERVER=TRUE}
    username: ${DATABASE_USER:sa}
    password: ${DATABASE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 30MB
      max-request-size: 120MB
  jackson:
    default-property-inclusion: non_null
  # SMTP : à renseigner par variables d'environnement (jamais dans le front ni dans le dépôt)
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:true}
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000

yaaba:
  storage-dir: ${STORAGE_DIR:./uploads}
  cors-origins: ${CORS_ORIGINS:http://localhost:4200,http://localhost:4300}
  jwt-secret: ${JWT_SECRET:kibare-dev-secret-change-me-in-production-2026}
  jwt-hours: 168
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
  # stockage des voix et vidéos sur Cloudinary (vide : sur disque, dans storage-dir)
  cloudinary-url: ${CLOUDINARY_URL:}
  mail:
    from: ${MAIL_FROM:KIBARE <no-reply@kibare.bf>}
    app-url: ${APP_URL:http://localhost:4200}
    outbox-dir: ${MAIL_OUTBOX:./data/outbox}
    # Brevo (API HTTPS, gratuite) : prioritaire sur SMTP quand la clé est définie
    brevo-api-key: ${BREVO_API_KEY:}
    require-verified: ${REQUIRE_VERIFIED_EMAIL:true}
  admin:
    email: ${ADMIN_EMAIL:admin@kibare.bf}
    password: ${ADMIN_PASSWORD:kibare2026}
    name: Équipe KIBARE

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs

management:
  endpoints:
    web:
      exposure:
        include: health
  # la santé du site ne dépend pas du serveur d'e-mail (injoignable chez certains hébergeurs)
  health:
    mail:
      enabled: false
